# ============================================================================
# Model B: jalur ambulans menuju RSUD Koja (satuan: kendaraan darurat per jam)
# SEMUA kapasitas adalah ASUMSI ILUSTRATIF. Kapasitas jalan umum dibuat kecil
# karena arus nyaris berhenti saat macet (sopir truk menempuh 500 m dalam 6 jam).
# ============================================================================
case_id: "case_30_jalan_darurat_ambulans"
title: "Jalan Darurat di Tol untuk Ambulans Menuju RSUD Koja"
description: >
  Saat akses Priok macet, sirine ambulans tidak mampu menembus kemacetan dan
  pasien harus didorong 500-700 meter ke RSUD Koja. Model ini membandingkan
  arus kendaraan darurat tanpa dan dengan jalan darurat di tol.

nodes:
  - {id: 0, label: "Lokasi ambulans (Priok)",        pos: [0.0, 2.0]}
  - {id: 1, label: "Jl. Yos Sudarso",                pos: [2.0, 3.0]}
  - {id: 2, label: "Jl. Cilincing / RE Martadinata", pos: [2.0, 2.0]}
  - {id: 3, label: "Akses tol",                      pos: [2.0, 1.0]}
  - {id: 4, label: "Jalan darurat tol",              pos: [2.0, 0.0]}
  - {id: 5, label: "RSUD Koja",                      pos: [4.0, 1.5]}

edges:
  - {from: 0, to: 1, weight: 1.0, capacity: 20}
  - {from: 0, to: 2, weight: 1.2, capacity: 20}
  - {from: 0, to: 3, weight: 1.5, capacity: 20}
  - {from: 0, to: 4, weight: 1.6, capacity: 0}     # jalan darurat belum ada
  - {from: 1, to: 5, weight: 1.0, capacity: 2}     # macet
  - {from: 2, to: 5, weight: 1.1, capacity: 2}     # macet
  - {from: 3, to: 5, weight: 1.2, capacity: 3}     # tol macet
  - {from: 4, to: 5, weight: 1.3, capacity: 10}    # jalan darurat, bebas macet

execution_plan:
  start_node: 0
  goal_node: 5
  algorithm: maxflow
  # Perkiraan max flow: 7 per jam sebelum event, 17 per jam sesudah event.
  events:
    - step: 1
      type: "DYNAMIC_EDGE_CAPACITY"
      target_edge: [0, 4]
      new_capacity: 10
      description: "Jalan darurat di tol dibuka untuk kendaraan darurat: kapasitas naik dari 0 jadi 10 per jam."
